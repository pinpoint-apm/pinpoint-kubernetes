name: Release Helm chart

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: helm-chart-release
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish chart
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: v3.21.2

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Ensure GitHub Pages branch exists
        shell: bash
        run: |
          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            empty_tree=$(git mktree </dev/null)
            bootstrap_commit=$(git commit-tree "$empty_tree" -m "chore: initialize Helm chart repository")
            git push origin "$bootstrap_commit:refs/heads/gh-pages"
          fi
          git fetch origin gh-pages:refs/remotes/origin/gh-pages

      - name: Validate chart
        run: bash scripts/helm-validate.sh

      - name: Package chart
        run: |
          mkdir -p .cr-release-packages
          helm package . --destination .cr-release-packages

      - name: Publish GitHub release and Pages index
        uses: helm/chart-releaser-action@v1.7.0
        with:
          skip_packaging: true
          skip_existing: true
          pages_branch: gh-pages
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
