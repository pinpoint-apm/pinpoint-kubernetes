{{- if .Values.bootstrap.enabled }}
{{- /*
Jobs are immutable. Name the Job after every input of its pod template so a
changed image, schema or setting creates a new Job instead of failing upgrade.
*/}}
{{- $schemaFile := .Files.Get "files/hbase-create.hbase" }}
{{- $script := .Files.Get "files/initialize-schema.rb" }}
{{- $retentionScript := .Files.Get "files/hbase-retention.rb" }}
{{- $inputs := list (include "backend.image" (dict "root" . "product" "hbase")) .Values.imagePullPolicy (toJson .Values.imagePullSecrets) (toJson .Values.bootstrap) (toJson .Values.global.retention) $schemaFile $script $retentionScript }}
{{- $jobHash := join "|" $inputs | sha256sum | trunc 8 }}
{{- /* Job names feed the 63-character job-name label. */}}
{{- $jobName := printf "%s-%s" (printf "%s-schema-%s" (include "backend.name" .) .Values.bootstrap.revision | trunc 54 | trimSuffix "-") $jobHash }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "backend.name" . }}-schema
  labels:
    app.kubernetes.io/part-of: pinpoint-storage
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  hbase-create.hbase: |
    {{- $schemaFile | nindent 4 }}
  initialize.rb: |
    {{- $script | nindent 4 }}
  hbase-retention.rb: |
    {{- $retentionScript | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $jobName }}
  labels:
    app.kubernetes.io/part-of: pinpoint-storage
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  # Normal Job: operators may need time to create discovery ConfigMaps and pods.
  activeDeadlineSeconds: 1800
  backoffLimit: 20
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: pinpoint-storage
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toJson . }}
      {{- end }}
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: schema
          image: {{ include "backend.image" (dict "root" . "product" "hbase") | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["/bin/bash", "-ec"]
          args:
            - |
              mkdir -p /tmp/hbase-conf
              cp /stackable/hbase/conf/* /tmp/hbase-conf/
              cp /discovery/hbase-site.xml /tmp/hbase-conf/hbase-site.xml
              /stackable/hbase/bin/hbase --config /tmp/hbase-conf shell -n /schema/initialize.rb
          env:
            - name: HBASE_READY_TIMEOUT
              value: {{ .Values.bootstrap.readyTimeoutSeconds | quote }}
            - name: PRE_SPLIT
              value: {{ .Values.bootstrap.preSplit | quote }}
            - name: PINPOINT_RETENTION_ENABLED
              value: {{ .Values.global.retention.enabled | quote }}
            - name: PINPOINT_RETENTION_DAYS
              value: {{ .Values.global.retention.days | quote }}
            - name: PINPOINT_RETENTION_APPLY_TO_EXISTING
              value: {{ .Values.global.retention.applyToExisting | quote }}
            - {name: HOME, value: /tmp}
            - {name: HBASE_LOG_DIR, value: /tmp}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml .Values.bootstrap.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: schema, mountPath: /schema, readOnly: true}
            - {name: discovery, mountPath: /discovery, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
        - name: schema
          configMap:
            name: {{ include "backend.name" . }}-schema
        - name: discovery
          configMap:
            name: {{ include "backend.name" . }}-hbase
{{- end }}
