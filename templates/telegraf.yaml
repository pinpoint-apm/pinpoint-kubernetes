{{- if and .Values.global.metric.enabled .Values.telegraf.enabled -}}
# Telegraf Deployment for System Metrics
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pinpoint.fullname" . }}-telegraf
  labels:
    {{- include "pinpoint.labels" . | nindent 4 }}
    app.kubernetes.io/component: telegraf
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "pinpoint.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: telegraf
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/telegraf-config.yaml") . | sha256sum }}
      labels:
        {{- include "pinpoint.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: telegraf
    spec:
      initContainers:
        - name: wait-for-collector
          image: {{ include "pinpoint.imageRegistry" . }}busybox:1.36
          resources:
            {{- toYaml .Values.global.initResources.wait | nindent 12 }}
          env:
            - name: COLLECTOR_SERVICE_NAME
              value: "{{ include "pinpoint.fullname" . }}-collector.{{ .Release.Namespace }}.svc.cluster.local"
          command:
            - 'sh'
            - '-c'
            - |
              echo "Waiting for Collector service to be ready..."
              echo "Target: ${COLLECTOR_SERVICE_NAME}:9991"

              # Wait for Collector thrift receiver port 9991
              until nc -z -w5 ${COLLECTOR_SERVICE_NAME} 9991; do
                echo "Telegraf is waiting for Collector..."
                sleep 5
              done

              echo "Collector is ready!"
      containers:
        - name: telegraf
          image: {{ include "pinpoint.imageRegistry" . }}{{ .Values.telegraf.image.repository }}:{{ .Values.telegraf.image.tag }}
          command:
            - 'telegraf'
            - '-config'
            - '/etc/telegraf/telegraf.conf'
          volumeMounts:
            - name: telegraf-shared-config
              mountPath: /etc/telegraf
              readOnly: true
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: etc
              mountPath: /host/etc
              readOnly: true
          env:
            - name: HOST_PROC
              value: "/host/proc"
            - name: HOST_SYS
              value: "/host/sys"
            - name: HOST_ETC
              value: "/host/etc"
          resources:
            {{- toYaml .Values.telegraf.resources | nindent 12 }}
      restartPolicy: Always
      volumes:
        - name: telegraf-shared-config
          configMap:
            name: {{ include "pinpoint.fullname" . }}-telegraf-config
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: etc
          hostPath:
            path: /etc
{{- end }}
