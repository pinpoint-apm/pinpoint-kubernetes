{{- if and .Values.global.metric.enabled .Values.telegraf.enabled -}}
# One Telegraf per node reports that node's host metrics to the Collector.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "pinpoint.fullname" . }}-telegraf
  labels:
    {{- include "pinpoint.labels" . | nindent 4 }}
    app.kubernetes.io/component: telegraf
spec:
  selector:
    matchLabels:
      {{- include "pinpoint.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: telegraf
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/telegraf-config.yaml") . | sha256sum }}
      labels:
        {{- include "pinpoint.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: telegraf
    spec:
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.telegraf.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.telegraf.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.telegraf.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-collector
          image: {{ include "pinpoint.waitImage" . | quote }}
          securityContext:
            {{- include "pinpoint.initSecurityContext" (dict "root" . "uid" 65534) | nindent 12 }}
          resources:
            {{- toYaml .Values.global.initResources.wait | nindent 12 }}
          env:
            - name: COLLECTOR_SERVICE_NAME
              value: "{{ include "pinpoint.fullname" . }}-collector"
          command:
            - 'sh'
            - '-c'
            - |
              # Telegraf posts to the Collector metric endpoint (Service port 15200).
              until nc -z -w5 "${COLLECTOR_SERVICE_NAME}" 15200; do
                echo "Telegraf is waiting for Collector..."
                sleep 5
              done
      containers:
        - name: telegraf
          image: "{{ include "pinpoint.imageRegistry" . }}{{ .Values.telegraf.image.repository }}:{{ .Values.telegraf.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          {{- with .Values.telegraf.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - 'telegraf'
            - '-config'
            - '/etc/telegraf/telegraf.conf'
          volumeMounts:
            - name: telegraf-shared-config
              mountPath: /etc/telegraf
              readOnly: true
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOST_PROC
              value: "/host/proc"
            - name: HOST_SYS
              value: "/host/sys"
          resources:
            {{- toYaml .Values.telegraf.resources | nindent 12 }}
      volumes:
        - name: telegraf-shared-config
          configMap:
            name: {{ include "pinpoint.fullname" . }}-telegraf-config
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
{{- end }}
