{{- $internalKafka := eq (include "pinpoint.kafka.internalEnabled" .) "true" -}}
{{- $manageTopics := or $internalKafka .Values.global.kafka.manageExternalTopics -}}
{{- if and .Values.global.metric.enabled .Values.global.kafka.createTopics $manageTopics }}
# Kafka Topics Initialization Job
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "pinpoint.fullname" . }}-kafka-init
  labels:
    {{- include "pinpoint.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka-init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "2"
    # Replace stale hook jobs and retain failures for inspection.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      name: {{ include "pinpoint.fullname" . }}-kafka-init
      labels:
        {{- include "pinpoint.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: kafka-init
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-kafka
          image: {{ include "pinpoint.waitImage" . | quote }}
          securityContext:
            {{- include "pinpoint.initSecurityContext" (dict "root" . "uid" 65534) | nindent 12 }}
          resources:
            {{- toYaml .Values.global.initResources.wait | nindent 12 }}
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ include "pinpoint.kafka.bootstrapServers" . | quote }}
          command:
            - 'sh'
            - '-c'
            - |
              echo "Waiting for Kafka to be ready..."
              KAFKA_ENDPOINT="${KAFKA_BOOTSTRAP_SERVERS%%,*}"
              KAFKA_HOST="${KAFKA_ENDPOINT%:*}"
              KAFKA_PORT="${KAFKA_ENDPOINT##*:}"
              until nc -z -w3 "$KAFKA_HOST" "$KAFKA_PORT"; do
                echo "Kafka init job waiting for Kafka..."
                sleep 5
              done
              echo "Kafka is ready!"
      containers:
        - name: kafka-topics-creator
          securityContext:
            {{- include "pinpoint.initSecurityContext" (dict "root" . "uid" 1001) | nindent 12 }}
          resources:
            {{- toYaml .Values.global.initResources.kafka | nindent 12 }}
          # Match the client to the bundled broker instead of downloading a
          # second, version-skewed Kafka distribution.
          image: {{ include "pinpoint.kafka.image" . | quote }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          command:
            - 'bash'
            - '-c'
            - |
              set -euo pipefail
              topics_cmd=/opt/bitnami/kafka/bin/kafka-topics.sh
              bootstrap="$KAFKA_BOOTSTRAP_SERVERS"

              until "$topics_cmd" --list --bootstrap-server "$bootstrap" >/dev/null 2>&1; do
                echo "Waiting for Kafka broker..."
                sleep 10
              done

              # Create missing topics, then repair topics that already exist
              # with fewer partitions (for example after broker auto-creation).
              # Partitions are only increased; topics are never deleted.
              warnings=0
              while read -r topic partitions; do
                [ -n "$topic" ] || continue
                "$topics_cmd" --create --if-not-exists --topic "$topic" \
                  --partitions "$partitions" --replication-factor "$TOPIC_REPLICATION_FACTOR" \
                  --bootstrap-server "$bootstrap"
                summary=$("$topics_cmd" --describe --topic "$topic" --bootstrap-server "$bootstrap" | grep -m1 'PartitionCount')
                current=$(printf '%s\n' "$summary" | sed -n 's/.*PartitionCount:[[:space:]]*\([0-9]*\).*/\1/p')
                replicas=$(printf '%s\n' "$summary" | sed -n 's/.*ReplicationFactor:[[:space:]]*\([0-9]*\).*/\1/p')
                if [ -z "$current" ] || [ -z "$replicas" ]; then
                  echo "Cannot read partition metadata for topic $topic" >&2
                  exit 1
                fi
                if [ "$current" -lt "$partitions" ]; then
                  echo "Raising $topic partitions from $current to $partitions"
                  "$topics_cmd" --alter --topic "$topic" --partitions "$partitions" --bootstrap-server "$bootstrap"
                fi
                if [ "$replicas" -lt "$TOPIC_REPLICATION_FACTOR" ]; then
                  echo "WARNING: $topic has replication factor $replicas, below $TOPIC_REPLICATION_FACTOR; reassign replicas manually." >&2
                  warnings=$((warnings + 1))
                fi
              done <<'TOPICS'
              {{- range .Values.global.kafka.topics }}
              {{ required "global.kafka.topics[].name is required" .name }} {{ required "global.kafka.topics[].partitions is required" .partitions | int }}
              {{- end }}
              TOPICS
              echo "Kafka topics verified (${warnings} replication warnings)."
          env:
            - name: KAFKA_HEAP_OPTS
              value: "-Xms128m -Xmx256m"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ include "pinpoint.kafka.bootstrapServers" . | quote }}
            - name: TOPIC_REPLICATION_FACTOR
              value: {{ .Values.global.kafka.topicReplicationFactor | quote }}
{{- end }}
