{{- if .Values.collector.enabled }}
# Collector Application Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pinpoint.fullname" . }}-collector
  labels:
    {{- include "pinpoint.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
spec:
  replicas: {{ .Values.collector.replicaCount }}
  strategy:
    {{- toYaml .Values.collector.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "pinpoint.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: collector
  template:
    metadata:
      {{- with .Values.collector.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "pinpoint.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: collector
    spec:
      {{- include "pinpoint.applicationPodSpec" (dict "root" . "component" "collector" "config" .Values.collector) | nindent 6 }}
      {{- if or .Values.hbase.enabled .Values.redis.enabled .Values.mysql.enabled (and .Values.global.metric.enabled (eq (include "pinpoint.pinot.internalEnabled" .) "true")) }}
      initContainers:
        # Wait for HBase - always required
        {{- if .Values.hbase.enabled }}
        - name: wait-for-hbase
          image: {{ include "pinpoint.imageRegistry" . }}busybox:1.36
          resources:
            {{- toYaml .Values.global.initResources.wait | nindent 12 }}
          command:
            - 'sh'
            - '-c'
            - |
              HBASE_POD_DNS="{{ include "pinpoint.fullname" . }}-hbase-0.{{ include "pinpoint.fullname" . }}-hbase.{{ .Release.Namespace }}.svc.cluster.local"

              # Wait for HBase to be ready
              until nc -z -w5 $HBASE_POD_DNS 16010; do
                echo "Collector is waiting for HBase..."
                sleep 5
              done

              echo "HBase is ready!"
        {{- end }}

        {{- if .Values.redis.enabled }}
        - name: wait-for-redis
          image: {{ include "pinpoint.imageRegistry" . }}busybox:1.36
          resources:
            {{- toYaml .Values.global.initResources.wait | nindent 12 }}
          env:
            - name: REDIS_HOST
              value: {{ include "pinpoint.redis.host" . | quote }}
            - name: REDIS_PORT
              value: {{ include "pinpoint.redis.port" . | quote }}
          command:
            - 'sh'
            - '-c'
            - |
              until nc -z -w3 "$REDIS_HOST" "$REDIS_PORT"; do
                echo "Collector is waiting for Redis..."
                sleep 2
              done
        {{- end }}

        {{- if and .Values.global.metric.enabled (eq (include "pinpoint.kafka.internalEnabled" .) "true") }}
        # Wait only for the bundled Kafka service. External services are
        # handled by the application and must not block pod startup.
        - name: wait-for-kafka
          image: {{ include "pinpoint.imageRegistry" . }}busybox:1.36
          resources:
            {{- toYaml .Values.global.initResources.wait | nindent 12 }}
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ include "pinpoint.kafka.bootstrapServers" . | quote }}
          command:
            - 'sh'
            - '-c'
            - |
              KAFKA_ENDPOINT="${KAFKA_BOOTSTRAP_SERVERS%%,*}"
              KAFKA_HOST="${KAFKA_ENDPOINT%:*}"
              KAFKA_PORT="${KAFKA_ENDPOINT##*:}"
              until nc -z -w3 "$KAFKA_HOST" "$KAFKA_PORT"; do
                echo "Collector is waiting for Kafka..."
                sleep 2
              done
        {{- end }}

        {{- if and .Values.global.metric.enabled (eq (include "pinpoint.pinot.internalEnabled" .) "true") }}
        # Wait for Pinot Controller only when metric profile is enabled.
        - name: wait-for-pinot-controller
          image: {{ include "pinpoint.imageRegistry" . }}busybox:1.36
          resources:
            {{- toYaml .Values.global.initResources.wait | nindent 12 }}
          command: ['sh', '-c', 'until nc -z -w3 {{ .Release.Name }}-pinot-controller 9000; do echo "Collector is waiting for Pinot Controller..."; sleep 2; done;']
        {{- end }}

      {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: logs
          emptyDir:
            sizeLimit: 256Mi
      {{- with .Values.collector.extraVolumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: collector
          image: "{{ include "pinpoint.imageRegistry" . }}{{ .Values.collector.image.repository }}:{{ include "pinpoint.applicationImageTag" (dict "tag" .Values.collector.image.tag "root" .) }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          {{- with .Values.collector.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            tcpSocket:
              port: grpc-agent
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            tcpSocket:
              port: grpc-agent
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: grpc-agent
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /app/logs
          {{- with .Values.collector.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: grpc-agent
              containerPort: 9991
            - name: grpc-stat
              containerPort: 9992
            - name: grpc-span
              containerPort: 9993
            - name: thrift-rcv
              containerPort: 9994
            - name: udp-stat
              containerPort: 9995
              protocol: UDP
            - name: udp-span
              containerPort: 9996
              protocol: UDP
          env:
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.collector.jvmOptions | quote }}
            # Dynamically set the Spring profile
            - name: SPRING_PROFILES_ACTIVE
              {{- if .Values.global.metric.enabled }}
              value: "{{ .Values.collector.config.springProfiles }},metric"
              {{- else }}
              value: {{ .Values.collector.config.springProfiles | quote }}
              {{- end }}
            - name: CLUSTER_ENABLE
              value: {{ .Values.collector.config.cluster.enable | quote }}
            - name: LOGGING_LEVEL_ROOT
              value: {{ .Values.collector.config.loggingLevel }}
            - name: PINPOINT_ZOOKEEPER_ADDRESS
              value: {{ include "pinpoint.zookeeper.address" . | quote }}
            # MySQL Connection Settings
            {{- if .Values.global.datasource.enabled }}
            {{- include "pinpoint.datasource.poolEnv" . | nindent 12 }}
            - name: SPRING_DATASOURCE_HIKARI_DRIVERCLASSNAME
              value: {{ include "pinpoint.datasource.driverClassName" . | quote }}
            - name: SPRING_DATASOURCE_HIKARI_JDBCURL
              value: {{ include "pinpoint.datasource.jdbcUrl" . | quote }}
            - name: SPRING_DATASOURCE_HIKARI_USERNAME
              value: {{ include "pinpoint.datasource.username" . | quote }}
            - name: SPRING_DATASOURCE_HIKARI_PASSWORD
              {{ include "pinpoint.datasource.password" . | nindent 14 }}
            {{- end }}

            # HBase discovery through its ZooKeeper ensemble.
            {{- include "pinpoint.hbase.clientEnv" . | nindent 12 }}

            # Add Kafka and Pinot configurations only when metric profile is active
            {{- if .Values.global.metric.enabled }}
            - name: PINPOINT_METRIC_KAFKA_BOOTSTRAP_SERVERS
              value: {{ include "pinpoint.kafka.bootstrapServers" . | quote }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ include "pinpoint.kafka.bootstrapServers" . | quote }}
            - name: SPRING_PINOTDATASOURCE_PINOT_JDBCURL
              value: {{ include "pinpoint.pinot.jdbcUrl" . | quote }}
            - name: PINPOINT_PINOT_JDBC_URL
              value: {{ include "pinpoint.pinot.jdbcUrl" . | quote }}
            # Remove empty username and password as Pinot driver doesn't accept empty strings
            {{- end }}
            {{- if .Values.global.datasource.enabled }}
            # Metadata Source Configuration
            - name: SPRING_METADATASOURCE_HIKARI_DRIVERCLASSNAME
              value: {{ include "pinpoint.datasource.driverClassName" . | quote }}
            - name: SPRING_METADATASOURCE_HIKARI_JDBCURL
              value: {{ include "pinpoint.datasource.jdbcUrl" . | quote }}
            - name: SPRING_METADATASOURCE_HIKARI_USERNAME
              value: {{ include "pinpoint.datasource.username" . | quote }}
            - name: SPRING_METADATASOURCE_HIKARI_PASSWORD
              {{ include "pinpoint.datasource.password" . | nindent 14 }}

            {{- end }}
            # Disable OTLP metrics in both metric enabled and disabled modes
            - name: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
              value: "false"
            - name: MANAGEMENT_METRICS_EXPORT_OTLP_ENABLED
              value: "false"
            # Redis Connection Settings
            - name: SPRING_DATA_REDIS_HOST
              value: {{ include "pinpoint.redis.host" . | quote }}
            - name: SPRING_DATA_REDIS_PORT
              value: {{ include "pinpoint.redis.port" . | quote }}
            - name: SPRING_DATA_REDIS_USERNAME
              value: {{ include "pinpoint.redis.username" . | quote }}
            - name: SPRING_DATA_REDIS_PASSWORD
              {{ include "pinpoint.redis.password" . | nindent 14 }}

            # Additional Collector Configuration (matching Docker Compose)
            {{- if not .Values.global.metric.enabled }}
            - name: FLINK_CLUSTER_ENABLE
              value: "true"
            - name: FLINK_CLUSTER_ZOOKEEPER_ADDRESS
              value: {{ include "pinpoint.zookeeper.address" . | quote }}
            {{- end }}
            {{- with .Values.collector.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
---
# Collector Application Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pinpoint.fullname" . }}-collector
  labels:
    {{- include "pinpoint.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
spec:
  type: {{ .Values.collector.service.type }}
  ports:
    - name: grpc-agent
      port: {{ .Values.collector.service.ports.grpcAgent }}
      targetPort: grpc-agent
      protocol: TCP
    - name: grpc-stat
      port: {{ .Values.collector.service.ports.grpcStat }}
      targetPort: grpc-stat
      protocol: TCP
    - name: grpc-span
      port: {{ .Values.collector.service.ports.grpcSpan }}
      targetPort: grpc-span
      protocol: TCP
    - name: thrift-receiver
      port: 9994
      targetPort: thrift-rcv
      protocol: TCP
    - name: udp-stat
      port: 9995
      targetPort: udp-stat
      protocol: UDP
    - name: udp-span
      port: 9996
      targetPort: udp-span
      protocol: UDP
    {{- if .Values.global.metric.enabled }}
    - name: metric-port
      port: 15200
      # Numeric target avoids duplicate 9995 TCP/UDP named-port merge conflicts.
      # Pinpoint 3.1.1 MetricApp listens on 9995/TCP.
      targetPort: 9995
      protocol: TCP
    {{- end }}
  selector:
    {{- include "pinpoint.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: collector
{{- end }}
