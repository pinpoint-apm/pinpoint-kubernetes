{{- if eq (include "pinpoint.mysql.initialize" .) "true" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name | trunc 38 | trimSuffix "-" }}-mysql-init-{{ printf "%s%s" (include (print $.Template.BasePath "/init-config-mysql.yaml") .) (include "pinpoint.mysql.initSpec" .) | sha256sum | trunc 8 }}
  labels:
    {{- include "pinpoint.labels" . | nindent 4 }}
    app.kubernetes.io/component: mysql-init
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous

spec:
  {{- include "pinpoint.mysql.initSpec" . | nindent 2 }}
{{- end }}
