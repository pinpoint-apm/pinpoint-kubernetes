{{- if eq (include "pinpoint.pinot.initialize" .) "true" }}
# Pinot Tables and Schemas Initialization Job
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "pinpoint.fullname" . }}-pinot-init
  labels:
    {{- include "pinpoint.labels" . | nindent 4 }}
    app.kubernetes.io/component: pinot-init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "3"
    # Replace stale hook jobs and retain failures for inspection.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      name: {{ include "pinpoint.fullname" . }}-pinot-init
      labels:
        {{- include "pinpoint.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: pinot-init
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- if eq (include "pinpoint.pinot.internalEnabled" .) "true" }}
      initContainers:
        - name: wait-for-pinot
          image: {{ include "pinpoint.imageRegistry" . }}busybox:1.36
          resources:
            {{- toYaml .Values.global.initResources.wait | nindent 12 }}
          command:
            - 'sh'
            - '-c'
            - |
              echo "Waiting for Pinot Controller to be ready..."
              until nc -z -w3 {{ .Release.Name }}-pinot-controller 9000; do
                echo "Pinot init job is waiting for Pinot Controller..."
                sleep 5
              done
              echo "Pinot Controller is ready!"

              echo "Waiting for Pinot Broker to be ready..."
              until nc -z -w3 {{ .Release.Name }}-pinot-broker 8099; do
                echo "Pinot init job is waiting for Pinot Broker..."
                sleep 5
              done
              echo "Pinot Broker is ready!"

      {{- end }}
      containers:
        - name: pinot-tables-creator
          image: "{{ include "pinpoint.imageRegistry" . }}{{ .Values.global.pinot.initImage.repository }}:{{ .Values.global.pinot.initImage.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          resources:
            {{- toYaml .Values.global.pinot.initResources | nindent 12 }}
          command: ["python3", "-B", "/config/initialize-pinot.py"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ include "pinpoint.kafka.bootstrapServers" . | quote }}
            - name: PINOT_CONTROLLER_URL
              value: {{ include "pinpoint.pinot.controllerUrl" . | quote }}
            - name: PINOT_DEFINITIONS_DIR
              value: "/config"
            - name: PINOT_TABLE_REPLICAS
              value: {{ .Values.global.pinot.tableReplicas | quote }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "pinpoint.fullname" . }}-pinot-init
{{- end }}
