{{- if .Values.web.enabled }}
{{- if .Values.web.login.enabled }}
{{- $_ := required "web.login.existingSecret is required when web.login.enabled=true" .Values.web.login.existingSecret }}
{{- $_ := required "web.login.jwtSecretKey is required when web.login.enabled=true" .Values.web.login.jwtSecretKey }}
{{- if not (or .Values.web.login.userKey .Values.web.login.adminKey) }}
{{- fail "web.login.userKey or web.login.adminKey is required when web.login.enabled=true" }}
{{- end }}
{{- if not (has .Values.web.login.cookie.sameSite (list "Lax" "Strict" "None")) }}
{{- fail "web.login.cookie.sameSite must be Lax, Strict, or None" }}
{{- end }}
{{- if and (eq .Values.web.login.cookie.sameSite "None") (not .Values.web.login.cookie.secure) }}
{{- fail "web.login.cookie.secure must be true when sameSite=None" }}
{{- end }}
{{- end }}
# Web Application Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pinpoint.fullname" . }}-web
  labels:
    {{- include "pinpoint.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  strategy:
    {{- toYaml .Values.web.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "pinpoint.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      {{- with .Values.web.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "pinpoint.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      {{- include "pinpoint.applicationPodSpec" (dict "root" . "component" "web" "config" .Values.web) | nindent 6 }}
      {{- if or .Values.zookeeper.enabled .Values.hbase.enabled .Values.redis.enabled .Values.mysql.enabled (and .Values.global.metric.enabled (eq (include "pinpoint.pinot.internalEnabled" .) "true")) }}
      initContainers:
        {{- if .Values.zookeeper.enabled }}
        - name: wait-for-zookeeper
          image: {{ include "pinpoint.imageRegistry" . }}busybox:1.36
          resources:
            {{- toYaml .Values.global.initResources.wait | nindent 12 }}
          command: ['sh', '-c', 'until nc -z -w3 {{ .Release.Name }}-zookeeper 2181; do echo "Web is waiting for Zookeeper..."; sleep 2; done;']
        {{- end }}
        {{- if .Values.mysql.enabled }}
        - name: wait-for-mysql
          image: "{{ include "pinpoint.imageRegistry" . }}{{ .Values.mysql.image.repository }}:{{ .Values.mysql.image.tag }}"
          resources:
            {{- toYaml .Values.global.initResources.wait | nindent 12 }}
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pinpoint.mysql.secretName" . | quote }}
                  key: mysql-root-password
          command:
            - 'sh'
            - '-c'
            - |
              until mysqladmin ping -h {{ .Release.Name }}-mysql --user=root -p"$MYSQL_ROOT_PASSWORD" --silent; do
                echo "Web is waiting for MySQL..."
                sleep 2
              done
              echo "Web Pod: MySQL is ready."
        {{- end }}

        {{- if .Values.hbase.enabled }}
        - name: wait-for-hbase
          image: {{ include "pinpoint.imageRegistry" . }}busybox:1.36
          resources:
            {{- toYaml .Values.global.initResources.wait | nindent 12 }}
          command: ['sh', '-c', 'until nc -z -w3 {{ include "pinpoint.fullname" . }}-hbase 16010; do echo "Web is waiting for HBase..."; sleep 2; done;']
        {{- end }}

        {{- if .Values.redis.enabled }}
        - name: wait-for-redis
          image: {{ include "pinpoint.imageRegistry" . }}busybox:1.36
          resources:
            {{- toYaml .Values.global.initResources.wait | nindent 12 }}
          env:
            - name: REDIS_HOST
              value: {{ include "pinpoint.redis.host" . | quote }}
            - name: REDIS_PORT
              value: {{ include "pinpoint.redis.port" . | quote }}
          command:
            - 'sh'
            - '-c'
            - |
              until nc -z -w3 "$REDIS_HOST" "$REDIS_PORT"; do
                echo "Web is waiting for Redis..."
                sleep 2
              done
        {{- end }}

        {{- if and .Values.global.metric.enabled (eq (include "pinpoint.pinot.internalEnabled" .) "true") }}
        # Wait for the Pinot Controller only when metric profile is enabled.
        - name: wait-for-pinot-controller
          image: {{ include "pinpoint.imageRegistry" . }}busybox:1.36
          resources:
            {{- toYaml .Values.global.initResources.wait | nindent 12 }}
          command: ['sh', '-c', 'until nc -z -w3 {{ .Release.Name }}-pinot-controller 9000; do echo "Web is waiting for Pinot Controller..."; sleep 2; done;']
        {{- end }}

      {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: logs
          emptyDir:
            sizeLimit: 256Mi
      {{- with .Values.web.extraVolumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: "{{ include "pinpoint.imageRegistry" . }}{{ .Values.web.image.repository }}:{{ include "pinpoint.applicationImageTag" (dict "tag" .Values.web.image.tag "root" .) }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          {{- with .Values.web.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /app/logs
          {{- with .Values.web.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.web.jvmOptions | quote }}
            - name: PINPOINT_ZOOKEEPER_ADDRESS
              value: {{ include "pinpoint.zookeeper.address" . | quote }}
            - name: CLUSTER_ENABLE
              value: "true"
            # Dynamically set the Spring profile
            - name: SPRING_PROFILES_ACTIVE
              {{- if .Values.global.metric.enabled }}
              value: "{{ .Values.web.config.springProfiles }},metric"
              {{- else }}
              value: {{ .Values.web.config.springProfiles | quote }}
              {{- end }}

            # MySQL Connection Settings
            {{- if .Values.global.datasource.enabled }}
            {{- include "pinpoint.datasource.poolEnv" . | nindent 12 }}
            - name: SPRING_DATASOURCE_HIKARI_DRIVERCLASSNAME
              value: {{ include "pinpoint.datasource.driverClassName" . | quote }}
            - name: SPRING_DATASOURCE_HIKARI_JDBCURL
              value: {{ include "pinpoint.datasource.jdbcUrl" . | quote }}
            - name: SPRING_DATASOURCE_HIKARI_USERNAME
              value: {{ include "pinpoint.datasource.username" . | quote }}
            - name: SPRING_DATASOURCE_HIKARI_PASSWORD
              {{ include "pinpoint.datasource.password" . | nindent 14 }}
            {{- end }}

            # HBase discovery through its ZooKeeper ensemble.
            {{- include "pinpoint.hbase.clientEnv" . | nindent 12 }}

            # Add Pinot JDBC configurations only when metric profile is enabled
            {{- if .Values.global.metric.enabled }}
            - name: SPRING_PINOT_DATASOURCE_PINOT_JDBC_URL
              value: {{ include "pinpoint.pinot.jdbcUrl" . | quote }}
            - name: SPRING_PINOTDATASOURCE_PINOT_JDBCURL
              value: {{ include "pinpoint.pinot.jdbcUrl" . | quote }}
            - name: PINPOINT_PINOT_JDBC_URL
              value: {{ include "pinpoint.pinot.jdbcUrl" . | quote }}
            # Remove empty username and password as Pinot driver doesn't accept empty strings
            {{- else }}
            # Disable Pinot datasource when metrics are disabled
            - name: SPRING_PINOT_DATASOURCE_PINOT_JDBC_URL
              value: ""
            - name: SPRING_PINOTDATASOURCE_PINOT_JDBCURL
              value: ""
            - name: PINPOINT_PINOT_JDBC_URL
              value: ""
            {{- end }}

            - name: SPRING_DATA_REDIS_HOST
              value: {{ include "pinpoint.redis.host" . | quote }}
            - name: SPRING_DATA_REDIS_PORT
              value: {{ include "pinpoint.redis.port" . | quote }}
            - name: SPRING_DATA_REDIS_USERNAME
              value: {{ include "pinpoint.redis.username" . | quote }}
            - name: SPRING_DATA_REDIS_PASSWORD
              {{ include "pinpoint.redis.password" . | nindent 14 }}

            # Additional Web Configuration (matching Docker Compose)
            - name: WEB_SERVER_PORT
              value: "8080"
            - name: ADMIN_PASSWORD
              value: "admin"
            - name: CONFIG_SENDUSAGE
              value: "true"
            - name: CONFIG_SHOW_APPLICATIONSTAT
              value: "true"
            {{- if .Values.global.datasource.enabled }}
            - name: JDBC_DRIVERCLASSNAME
              value: {{ include "pinpoint.datasource.driverClassName" . | quote }}
            - name: JDBC_URL
              value: {{ include "pinpoint.datasource.jdbcUrl" . | quote }}
            - name: JDBC_USERNAME
              value: {{ include "pinpoint.datasource.username" . | quote }}
            - name: JDBC_PASSWORD
              {{ include "pinpoint.datasource.password" . | nindent 14 }}

            # Metadata Source Configuration
            - name: SPRING_METADATASOURCE_HIKARI_DRIVERCLASSNAME
              value: {{ include "pinpoint.datasource.driverClassName" . | quote }}
            - name: SPRING_METADATASOURCE_HIKARI_JDBCURL
              value: {{ include "pinpoint.datasource.jdbcUrl" . | quote }}
            - name: SPRING_METADATASOURCE_HIKARI_USERNAME
              value: {{ include "pinpoint.datasource.username" . | quote }}
            - name: SPRING_METADATASOURCE_HIKARI_PASSWORD
              {{ include "pinpoint.datasource.password" . | nindent 14 }}
            {{- end }}

            # Security Configuration
            - name: PINPOINT_MODULES_WEB_LOGIN
              value: {{ ternary "basicLogin" "false" .Values.web.login.enabled | quote }}
            {{- if .Values.web.login.enabled }}
            {{- if .Values.web.login.userKey }}
            - name: WEB_SECURITY_AUTH_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.web.login.existingSecret | quote }}
                  key: {{ .Values.web.login.userKey | quote }}
            {{- end }}
            {{- if .Values.web.login.adminKey }}
            - name: WEB_SECURITY_AUTH_ADMIN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.web.login.existingSecret | quote }}
                  key: {{ .Values.web.login.adminKey | quote }}
            {{- end }}
            - name: WEB_SECURITY_AUTH_JWT_SECRETKEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.web.login.existingSecret | quote }}
                  key: {{ .Values.web.login.jwtSecretKey | quote }}
            - name: WEB_SECURITY_AUTH_JWT_COOKIE_HTTP_ONLY
              value: "true"
            - name: WEB_SECURITY_AUTH_JWT_COOKIE_SECURE
              value: {{ .Values.web.login.cookie.secure | quote }}
            - name: WEB_SECURITY_AUTH_JWT_COOKIE_SAME_SITE
              value: {{ .Values.web.login.cookie.sameSite | quote }}
            {{- end }}

            {{- with .Values.web.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
---
# Web Application Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pinpoint.fullname" . }}-web
  labels:
    {{- include "pinpoint.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "pinpoint.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
---
{{- if .Values.web.ingress.enabled -}}
# Web Application Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "pinpoint.fullname" . }}-web
  labels:
    {{- include "pinpoint.labels" . | nindent 4 }}
  {{- with .Values.web.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.web.ingress.ingressClassName }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.web.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.web.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path | quote }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "pinpoint.fullname" $ }}-web
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
