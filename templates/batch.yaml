{{- if and .Values.batch.enabled (not .Values.global.metric.enabled) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pinpoint.fullname" . }}-batch
  labels:
    {{- include "pinpoint.labels" . | nindent 4 }}
    app.kubernetes.io/component: batch
spec:
  replicas: {{ .Values.batch.replicaCount }}
  selector:
    matchLabels:
      {{- include "pinpoint.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: batch
  template:
    metadata:
      labels:
        {{- include "pinpoint.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: batch
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.batch.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.zookeeper.enabled .Values.hbase.enabled .Values.mysql.enabled .Values.flink.enabled }}
      initContainers:
        # Wait for Zookeeper to be ready
        {{- if .Values.zookeeper.enabled }}
        - name: wait-for-zookeeper
          image: {{ include "pinpoint.waitImage" . | quote }}
          securityContext:
            {{- include "pinpoint.initSecurityContext" (dict "root" . "uid" 65534) | nindent 12 }}
          resources:
            {{- toYaml .Values.global.initResources.wait | nindent 12 }}
          command: ['sh', '-c', 'until nc -z -w3 {{ .Release.Name }}-zookeeper 2181; do echo "Batch is waiting for Zookeeper..."; sleep 2; done;']

        {{- end }}
        # Wait for HBase to be ready
        {{- if .Values.hbase.enabled }}
        - name: wait-for-hbase
          image: {{ include "pinpoint.waitImage" . | quote }}
          securityContext:
            {{- include "pinpoint.initSecurityContext" (dict "root" . "uid" 65534) | nindent 12 }}
          resources:
            {{- toYaml .Values.global.initResources.wait | nindent 12 }}
          command: ['sh', '-c', 'until nc -z -w3 {{ include "pinpoint.fullname" . }}-hbase 60000; do echo "Batch is waiting for HBase..."; sleep 2; done;']
        {{- end }}

        # Wait for MySQL to be ready
        {{- if .Values.mysql.enabled }}
        - name: wait-for-mysql
          image: {{ include "pinpoint.waitImage" . | quote }}
          securityContext:
            {{- include "pinpoint.initSecurityContext" (dict "root" . "uid" 65534) | nindent 12 }}
          resources:
            {{- toYaml .Values.global.initResources.wait | nindent 12 }}
          command: ['sh', '-c', 'until nc -z -w3 {{ .Release.Name }}-mysql 3306; do echo "Batch is waiting for MySQL..."; sleep 2; done;']
        {{- end }}

        # Wait for Flink JobManager to be ready (needed for health checks)
        {{- if .Values.flink.enabled }}
        - name: wait-for-flink-jobmanager
          image: {{ include "pinpoint.waitImage" . | quote }}
          securityContext:
            {{- include "pinpoint.initSecurityContext" (dict "root" . "uid" 65534) | nindent 12 }}
          resources:
            {{- toYaml .Values.global.initResources.wait | nindent 12 }}
          command: ['sh', '-c', 'until nc -z -w3 {{ include "pinpoint.fullname" . }}-flink-jobmanager 8081; do echo "Batch is waiting for Flink JobManager..."; sleep 2; done;']
        {{- end }}
      {{- end }}
      containers:
        - name: batch
          image: "{{ include "pinpoint.imageRegistry" . }}{{ .Values.batch.image.repository }}:{{ .Values.batch.image.tag | default .Values.global.pinpointVersion }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          {{- with .Values.batch.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- include "pinpoint.hbase.clientEnv" . | nindent 12 }}
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.batch.config.springProfiles | quote }}
            - name: BATCH_SERVER_PORT
              value: "8080"
            - name: PINPOINT_ZOOKEEPER_ADDRESS
              value: {{ include "pinpoint.zookeeper.address" . | quote }}
            - name: CLUSTER_ENABLE
              value: "true"
            - name: LOGGING_LEVEL_ROOT
              value: {{ .Values.batch.config.loggingLevel | quote }}
            - name: CONFIG_SENDUSAGE
              value: {{ .Values.batch.config.sendUsage | quote }}
            - name: CONFIG_SHOW_APPLICATIONSTAT
              value: "true"
            - name: BATCH_FLINK_SERVER
              value: "{{ include "pinpoint.fullname" . }}-flink-jobmanager:8081"
            # JDBC Configuration - Primary Datasource
            {{- if .Values.global.datasource.enabled }}
            {{- include "pinpoint.datasource.poolEnv" . | nindent 12 }}
            - name: JDBC_DRIVERCLASSNAME
              value: {{ include "pinpoint.datasource.driverClassName" . | quote }}
            - name: JDBC_URL
              value: {{ include "pinpoint.datasource.jdbcUrl" . | quote }}
            - name: JDBC_USERNAME
              value: {{ include "pinpoint.datasource.username" . | quote }}
            - name: JDBC_PASSWORD
              {{ include "pinpoint.datasource.password" . | nindent 14 }}
            # Spring Datasource Configuration
            - name: SPRING_DATASOURCE_HIKARI_DRIVERCLASSNAME
              value: {{ include "pinpoint.datasource.driverClassName" . | quote }}
            - name: SPRING_DATASOURCE_HIKARI_JDBCURL
              value: {{ include "pinpoint.datasource.jdbcUrl" . | quote }}
            - name: SPRING_DATASOURCE_HIKARI_USERNAME
              value: {{ include "pinpoint.datasource.username" . | quote }}
            - name: SPRING_DATASOURCE_HIKARI_PASSWORD
              {{ include "pinpoint.datasource.password" . | nindent 14 }}
            # Spring Metadata Datasource Configuration
            - name: SPRING_METADATASOURCE_HIKARI_DRIVERCLASSNAME
              value: {{ include "pinpoint.datasource.driverClassName" . | quote }}
            - name: SPRING_METADATASOURCE_HIKARI_JDBCURL
              value: {{ include "pinpoint.datasource.jdbcUrl" . | quote }}
            - name: SPRING_METADATASOURCE_HIKARI_USERNAME
              value: {{ include "pinpoint.datasource.username" . | quote }}
            - name: SPRING_METADATASOURCE_HIKARI_PASSWORD
              {{ include "pinpoint.datasource.password" . | nindent 14 }}
            {{- end }}
            # Alarm mail: Batch 3.1.1 reads Spring Mail properties (spring.mail.*).
            {{- if .Values.batch.mail.enabled }}
            {{- $mail := .Values.batch.mail }}
            - name: SPRING_MAIL_HOST
              value: {{ $mail.host | quote }}
            - name: SPRING_MAIL_PORT
              value: {{ $mail.port | quote }}
            - name: SPRING_MAIL_PROTOCOL
              value: "smtp"
            - name: SPRING_MAIL_USERNAME
              value: {{ $mail.username | quote }}
            {{- if $mail.existingSecret }}
            - name: SPRING_MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $mail.existingSecret | quote }}
                  key: {{ default "password" $mail.existingSecretKey | quote }}
            {{- end }}
            - name: SPRING_MAIL_PROPERTIES_MAIL_SMTP_FROM
              value: {{ default $mail.username $mail.from | quote }}
            - name: SPRING_MAIL_PROPERTIES_MAIL_SMTP_PORT
              value: {{ $mail.port | quote }}
            - name: SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH
              value: {{ $mail.smtpAuth | quote }}
            - name: SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE
              value: {{ $mail.starttls | quote }}
            - name: SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED
              value: {{ $mail.starttlsRequired | quote }}
            {{- end }}
            # Pinpoint Web URL for batch operations
            - name: SPRING_MAIL_PINPOINT-URL
              value: {{ tpl .Values.batch.config.pinpointWebUrl . | quote }}
            # Disable Pinot datasource when metrics are disabled
            {{- if not .Values.global.metric.enabled }}
            - name: SPRING_PINOT-DATASOURCE_PINOT_JDBC-URL
              value: ""
            - name: SPRING_PINOTDATASOURCE_PINOT_JDBCURL
              value: ""
            - name: PINPOINT_PINOT_JDBC_URL
              value: ""
            {{- end }}
            # JVM Memory Settings
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.batch.jvmOptions | quote }}
          resources:
            {{- toYaml .Values.batch.resources | nindent 12 }}
{{- end }}
