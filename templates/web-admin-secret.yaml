{{- if and .Values.web.enabled (not .Values.web.adminApi.passwordSecret.name) }}
{{- $name := include "pinpoint.web.adminApiSecretName" . }}
{{- $password := randAlphaNum 32 | b64enc }}
{{- /* Keep the generated password stable across upgrades. */}}
{{- with lookup "v1" "Secret" .Release.Namespace $name }}
{{- with index (default dict .data) "admin-password" }}
{{- $password = . }}
{{- end }}
{{- end }}
# Generated admin.password for Pinpoint Web's /api/admin/** endpoints.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "pinpoint.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
type: Opaque
data:
  admin-password: {{ $password }}
{{- end }}
