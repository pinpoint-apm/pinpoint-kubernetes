{{- if and .Values.web.enabled .Values.web.httpRoute.enabled }}
{{- $route := .Values.web.httpRoute }}
{{- if not $route.parentRefs }}
{{- fail "web.httpRoute.parentRefs is required when web.httpRoute.enabled=true" }}
{{- end }}
# Web Application HTTPRoute (Gateway API)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "pinpoint.fullname" . }}-web
  labels:
    {{- include "pinpoint.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
    {{- with $route.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml $route.parentRefs | nindent 4 }}
  {{- with $route.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ $route.path | quote }}
      backendRefs:
        - name: {{ include "pinpoint.fullname" . }}-web
          port: {{ .Values.web.service.port }}
{{- end }}
