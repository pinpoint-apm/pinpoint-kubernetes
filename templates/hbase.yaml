{{- if .Values.hbase.enabled }}
# Hbase Application StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pinpoint.fullname" . }}-hbase
  labels:
    {{- include "pinpoint.labels" . | nindent 4 }}
    app.kubernetes.io/component: hbase
spec:
  replicas: 1
  serviceName: {{ include "pinpoint.fullname" . }}-hbase
  selector:
    matchLabels:
      {{- include "pinpoint.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: hbase
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/hbase-config.yaml") . | sha256sum }}
      labels:
        {{- include "pinpoint.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: hbase
    spec:
      {{- with .Values.hbase.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.hbase.terminationGracePeriodSeconds }}
      {{- if .Values.zookeeper.enabled }}
      initContainers:
        # Wait for Zookeeper to be ready
        - name: wait-for-zookeeper
          image: {{ include "pinpoint.imageRegistry" . }}busybox:1.36
          resources:
            {{- toYaml .Values.global.initResources.wait | nindent 12 }}
          command: ['sh', '-c', 'until nc -z -w3 {{ .Release.Name }}-zookeeper 2181; do echo "HBase is waiting for Zookeeper..."; sleep 2; done;']
      {{- end }}
      volumes:
        - name: hbase-config-volume
          configMap:
            name: {{ include "pinpoint.fullname" . }}-hbase-config
            defaultMode: 0755
        {{- if not .Values.hbase.persistence.enabled }}
        - name: hbase-data
          emptyDir: {}
        {{- end }}
      containers:
        - name: hbase
          image: "{{ include "pinpoint.imageRegistry" . }}{{ .Values.hbase.image.repository }}:{{ .Values.hbase.image.tag | default .Values.global.pinpointVersion }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          command: ["/bin/bash", "/opt/pinpoint-hbase/start.sh"]
          ports:
            - containerPort: 60000
              name: master-api
            - containerPort: 16010
              name: master-ui
            - containerPort: 60020
              name: region-api
            - containerPort: 16030
              name: region-ui
          env:
            - name: HBASE_HEAPSIZE
              value: {{ .Values.hbase.heapSize | quote }}
            - name: HBASE_PID_DIR
              value: /tmp/pinpoint-hbase-pids
            - name: HBASE_IDENT_STRING
              value: pinpoint
            - name: HBASE_MANAGES_ZK
              value: {{ .Values.hbase.config.managesZk | quote }}
            # ZooKeeper Configuration (external ZooKeeper)
            - name: HBASE_ZOOKEEPER_QUORUM
              value: {{ include "pinpoint.hbase.quorum" . | quote }}
            - name: HBASE_ZOOKEEPER_PROPERTY_CLIENTPORT
              value: {{ .Values.global.hbase.clientPort | quote }}
            {{- range $key, $val := .Values.hbase.config.ttl }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          volumeMounts:
            - name: hbase-data
              mountPath: /home/pinpoint/hbase
            - name: hbase-config-volume
              mountPath: /opt/pinpoint-hbase
          startupProbe:
            {{- toYaml .Values.hbase.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.hbase.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.hbase.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.hbase.resources | nindent 12 }}
  {{- if .Values.hbase.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: hbase-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: {{ .Values.hbase.persistence.size }}
        {{- with .Values.hbase.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
  {{- end }}
{{- end }}
---
{{- if .Values.hbase.enabled }}
# Hbase Application Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pinpoint.fullname" . }}-hbase
  labels:
    {{- include "pinpoint.labels" . | nindent 4 }}
    app.kubernetes.io/component: hbase
spec:
  clusterIP: None
  ports:
    - port: 60000
      name: master-api
    - port: 16010
      name: master-ui
    - port: 60020
      name: region-api
    - port: 16030
      name: region-ui
  selector:
    {{- include "pinpoint.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: hbase
{{- end }}
