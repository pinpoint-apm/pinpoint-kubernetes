  - annotations:
      artifacthub.io/changes: |
        - kind: security
          description: Generate the Web admin API password instead of using "admin"
        - kind: security
          description: Generate bundled MySQL passwords and disable UI usage reporting by default
        - kind: removed
          description: Remove the non-functional standalone agent Deployment
        - kind: fixed
          description: Repair Kafka topics created with too few partitions
        - kind: fixed
          description: Apply Pinpoint 3.1.1 HBase index TTLs and Batch Spring Mail settings
        - kind: changed
          description: Make Telegraf an opt-in DaemonSet and harden init containers
        - kind: added
          description: Gateway API HTTPRoute, values-minimal.yaml and registry/pull-secret coverage
      artifacthub.io/images: |
        - name: pinpoint-web
          image: pinpointdocker/pinpoint-web:3.1.1-metric
        - name: pinpoint-collector
          image: pinpointdocker/pinpoint-collector:3.1.1-metric
        - name: pinpoint-hbase
          image: pinpointdocker/pinpoint-hbase:3.1.1
        - name: pinot
          image: apachepinot/pinot:1.3.0
      artifacthub.io/license: Apache-2.0
      artifacthub.io/links: |
        - name: Production guide
          url: https://github.com/pinpoint-apm/pinpoint-kubernetes/blob/master/docs/PRODUCTION.md
        - name: Upgrade notes
          url: https://github.com/pinpoint-apm/pinpoint-kubernetes/blob/master/docs/UPGRADING.md
