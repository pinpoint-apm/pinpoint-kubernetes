  pinpoint:
  - annotations:
      artifacthub.io/changes: |
        - kind: added
          description: Configure history retention in days with explicit opt-in for existing HBase and Pinot tables
      artifacthub.io/images: |
        - name: pinpoint-web
          image: pinpointdocker/pinpoint-web:3.1.1-metric
        - name: pinpoint-collector
          image: pinpointdocker/pinpoint-collector:3.1.1-metric
        - name: pinpoint-hbase
          image: pinpointdocker/pinpoint-hbase:3.1.1
        - name: pinot
          image: apachepinot/pinot:1.3.0
      artifacthub.io/license: Apache-2.0
      artifacthub.io/links: |
        - name: Production guide
          url: https://github.com/pinpoint-apm/pinpoint-kubernetes/blob/master/docs/PRODUCTION.md
        - name: Upgrade notes
          url: https://github.com/pinpoint-apm/pinpoint-kubernetes/blob/master/docs/UPGRADING.md
