apiVersion: v2
name: pinpoint
description: A Helm chart for deploying Pinpoint APM (Application Performance Management) on Kubernetes.
type: application
version: 3.1.6
appVersion: "3.1.1"

annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Production guide
      url: https://github.com/pinpoint-apm/pinpoint-kubernetes/blob/master/docs/PRODUCTION.md
    - name: Upgrade notes
      url: https://github.com/pinpoint-apm/pinpoint-kubernetes/blob/master/docs/UPGRADING.md
  artifacthub.io/images: |
    - name: pinpoint-web
      image: pinpointdocker/pinpoint-web:3.1.1-metric
    - name: pinpoint-collector
      image: pinpointdocker/pinpoint-collector:3.1.1-metric
    - name: pinpoint-hbase
      image: pinpointdocker/pinpoint-hbase:3.1.1
    - name: pinot
      image: apachepinot/pinot:1.3.0
  artifacthub.io/changes: |
    - kind: added
      description: Configure history retention in days with explicit opt-in for existing HBase and Pinot tables

keywords:
  - apm
  - pinpoint
  - monitoring
  - performance
  - metrics

home: https://github.com/pinpoint-apm/pinpoint-kubernetes
icon: https://raw.githubusercontent.com/pinpoint-apm/pinpoint/v3.1.1/doc/images/NAVERPinpoint.png
sources:
  - https://github.com/pinpoint-apm/pinpoint

maintainers:
  - name: Emircan Agac
    email: thesadson@gmail.com

dependencies:
  # Shared ZooKeeper for HBase, Pinpoint and Pinot (Kafka uses KRaft).
  - name: zookeeper
    version: "13.8.7"
    repository: "https://charts.bitnami.com/bitnami"
    condition: zookeeper.enabled

  # Database required by Pinpoint Web/Collector/Batch modules
  - name: mysql
    version: "14.0.3"
    repository: "https://charts.bitnami.com/bitnami"
    condition: mysql.enabled

  # Required for Pinpoint 3.x functionalities
  - name: redis
    version: "22.0.7"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled

  # Follow metric mode unless kafka.enabled explicitly overrides it.
  - name: kafka
    version: "32.4.3"
    repository: "https://charts.bitnami.com/bitnami"
    condition: kafka.enabled,global.metric.enabled

  # Pinot is required by the metric profile.
  - name: pinot
    version: "0.3.4"
    repository: "https://raw.githubusercontent.com/apache/pinot/master/helm"
    condition: pinot.enabled,global.metric.enabled
